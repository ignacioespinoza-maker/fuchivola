<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuchivola</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" integrity="sha512-" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            background: linear-gradient(135deg, #0b2a36 0%, #0f4b6f 50%, #081f2c 100%);
            color: #f2f2f2;
        }
        .hero {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 0 40px rgba(0,0,0,0.3);
        }
        .card-glow {
            background: rgba(11, 34, 54, 0.92);
            border: 1px solid rgba(255,255,255,0.12);
        }
        .player-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform .2s ease-in-out;
        }
        .player-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }
        .team-banner {
            border-radius: 1rem;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.25);
        }
        .tier-box {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            min-height: 190px;
        }
        .tier-box h5 {
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-size: .95rem;
        }
        .player-photo {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(255,255,255,0.06);
        }
        h1, h2, h3, h4, h5, h6 {
            color: #ffffff !important;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75 mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'index' %}">
            <img src="{% static 'img/logo.webp' %}" alt="Logo" width="42" height="42" class="me-2 rounded-circle" style="object-fit: cover;">
            <span>Fuchivola</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'tier_list' %}">Tier List</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js" integrity="sha512-" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
